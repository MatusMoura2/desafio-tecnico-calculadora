version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: calculadora_db
    restart: always
    environment:
      POSTGRES_DB: calculadora_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d calculadora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./desafio-calculadora-back
      dockerfile: Dockerfile
    container_name: calculadora_backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: calculadora_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./desafio-calculadora-front
      dockerfile: Dockerfile
    container_name: calculadora_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
